<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0f1117" />
  <title>code-hub</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="topbar">
    <div class="title-block">
      <h1>code-hub</h1>
      <p class="subtitle">launcher for everything under <span class="path-chip">~/cc-projects/</span></p>
    </div>
    <div class="pills">
      <span id="cf-status" class="pill" title="cloudflared availability"></span>
      <span id="ts-status" class="pill" title="tailscale availability"></span>
    </div>
  </header>

  <main id="app">
    <div class="toolbar">
      <label class="sort">
        <span>Sort</span>
        <select id="sort">
          <option value="edited">Last edited</option>
          <option value="name">Name</option>
          <option value="status">Status</option>
        </select>
      </label>
      <button id="refresh" title="Refresh">↻</button>
    </div>
    <div id="empty" class="empty">Loading apps…</div>
    <div id="projects"></div>
    <footer id="footer"><span id="updated"></span></footer>
  </main>

  <dialog id="qr-dialog">
    <div class="qr-large" id="qr-large"></div>
    <a id="qr-open" class="btn-link" target="_blank" rel="noopener">▶ Open</a>
    <form method="dialog"><menu><button value="close">Close</button></menu></form>
  </dialog>

  <script type="module" src="app.js"></script>
  <script src="/pluginBridge.js" defer></script>
</body>
</html>
